[package]
name = "ferrowl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["vscode_dark"]
vscode_dark = ["ferrowl-ui/vscode_dark"]
catppuccin_mocha = ["ferrowl-ui/catppuccin_mocha"]
gruvbox_dark = ["ferrowl-ui/gruvbox_dark"]

[dependencies]
ferrowl-util = { path = "../ferrowl-util" }
ferrowl-codec = { path = "../ferrowl-codec" }
ferrowl-ui = { path = "../ferrowl-ui", default-features = false }
ferrowl-ring = { path = "../ferrowl-ring" }
ferrowl-store = { path = "../ferrowl-store" }
ferrowl-modbus = { path = "../ferrowl-modbus" }
ferrowl-ocpp = { path = "../ferrowl-ocpp" }
ferrowl-lua = { path = "../ferrowl-lua" }
ferrowl-syntax = { path = "../ferrowl-syntax" }
ferrowl-templates = { path = "../ferrowl-templates" }
ferrowl-ui-derive = { path = "../ferrowl-ui-derive" }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `rt-multi-thread` is named here rather than inherited: the binary builds a multi-threaded
# runtime itself, and it used to arrive only as a transitive feature of the Modbus library.
tokio = { workspace = true, features = [
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "signal",
] }
derive_builder = { workspace = true }
parking_lot = { workspace = true }
futures-util = { workspace = true }
mlua = { workspace = true }

[dev-dependencies]
# Held-port and per-run temp-dir guards for tests (NF-R-043/044).
ferrowl-test-support = { path = "../ferrowl-test-support" }
# A real client, for a test that reads a served module's store over the wire (MB-R-210).
rust-modbus = { workspace = true }
