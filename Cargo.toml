[workspace]
resolver = "3"
members = [
    "ferrowl-lua",
    "ferrowl-store",
    "ferrowl-syntax",
    "ferrowl-codec",
    "ferrowl-ring",
    "ferrowl-modbus",
    "ferrowl-ocpp",
    "ferrowl-util",
    "ferrowl-ui",
    "ferrowl",
    "ferrowl-ui-derive",
    "ferrowl-lua-derive",
    "ferrowl-templates",
    "ferrowl-test-support",
]

# All 14 crates are versioned in lockstep — bump this, not the members.
[workspace.package]
version = "0.6.1"
edition = "2024"
authors = ["David Loewe <49597367+TumbleOwlee@users.noreply.github.com>"]
license = "MIT"
# The workspace ships a binary, not libraries: releases are GitHub artifacts and nothing here
# is on crates.io. Saying so lets the crates depend on each other by bare path.
publish = false

# The lint policy CI enforces (`cargo clippy --workspace -- -D warnings`), stated here so a bare
# `cargo clippy` and the editor see it too.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Bare `unwrap` is denied in non-test code: every fallible call must document why it cannot fail
# via `expect("...")`. `expect_used` stays off — `expect` is the sanctioned, documented form. Test
# code is exempt (see clippy.toml).
unwrap_used = "deny"
derive_partial_eq_without_eq = "warn"
uninlined_format_args = "warn"
map_unwrap_or = "warn"
assigning_clones = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# Every external dependency lives here so two crates cannot drift onto different versions of the
# same one. Members add features on top; they never restate a version.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
convert_case = "0.12.0"
crossterm = "0.29.0"
derive_builder = "0.20.2"
futures-util = "0.3.34"
getset = "0.1.7"
itertools = "0.15.0"
mlua = { version = "0.12.1", features = ["anyhow", "lua54", "vendored"] }
once_cell = "1.21.4"
parking_lot = "0.12"
proc-macro2 = "1.0.107"
quote = "1.0.47"
ratatui = { version = "0.30.2", features = [
    "all-widgets",
    "unstable-widget-ref",
] }
rcgen = "0.14.10"
# Pinned by rev, not branch: `cargo update` must not silently move us to whatever the fork's
# `main` points at. Bump the rev deliberately when pulling in upstream changes.
rust-modbus = { git = "https://github.com/TumbleOwlee/rust-modbus", rev = "2f3ecebd3a10060e72619a82d8e01ea2d870166a", default-features = false }
rust-ocpp = { git = "https://github.com/TumbleOwlee/rust-ocpp", rev = "36813f46ab7d0a50100f1e0fe099aaf0c4e10791", default-features = false }
# Already pulled in transitively by rustls's "ring" feature below; named directly so
# ferrowl-modbus can hash a rejected TLS peer certificate (MB-R-111) without pinning its
# own, possibly-divergent, copy.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pki-types = { version = "1.15", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = "3.0.5"
# Already pulled in transitively by rustls's "ring" feature above; named directly so
# ferrowl-ocpp can do a constant-time Basic Auth credential comparison (NF-R-032) without
# pinning its own, possibly-divergent, copy.
subtle = "2.6.1"
thiserror = "2.0"
tokio = "1.53.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
toml = "1.1.5"
uuid = { version = "1", features = ["v4"] }
validator = "0.21.0"
webpki-roots = "1.0.9"

# Speed up repeated release builds during development.
[profile.release]
incremental = true

# Fast iteration profile: optimized enough to be usable, much quicker to build.
# Usage: cargo build --profile fastrel
[profile.fastrel]
inherits = "release"
opt-level = 1
debug = false
